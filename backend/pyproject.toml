[project]
name = "movieshazam-backend"
version = "1.0.0"
description = "MovieShazam : identification locale d'extraits vidéo (pHash + alignement temporel)"
requires-python = ">=3.11,<3.13"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "B905", "SIM105", "SIM108", "UP040"]
